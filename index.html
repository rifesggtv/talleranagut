<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Calle Peligrosa AR</title>
    
    <style>
        :root {
            --primary: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
            --alert: #ff0000;
            --success: #2ecc71;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        /* Camera Background */
        #bg-camera {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: 0;
        }

        /* UI Overlays */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            background: rgba(0, 0, 0, 0.7);
            color: var(--light);
            text-align: center;
            padding: 20px;
        }

        .hidden {
            display: none !important;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px #000;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 20px;
            max-width: 400px;
            line-height: 1.5;
        }

        button {
            padding: 15px 30px;
            font-size: 1.3rem;
            font-weight: bold;
            color: white;
            background-color: var(--primary);
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            cursor: pointer;
            transition: transform 0.1s, background-color 0.2s;
        }

        button:active {
            transform: scale(0.95);
        }

        /* Game HUD */
        #game-hud {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 0 #000, -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000;
            background: rgba(0,0,0,0.5);
            padding: 5px 20px;
            border-radius: 20px;
        }

        /* Warnings */
        .warning-indicator {
            position: absolute;
            font-size: 4rem;
            color: var(--alert);
            text-shadow: 0 0 15px rgba(255,0,0,0.8);
            animation: pulse 0.5s infinite alternate;
            display: none;
        }

        #warn-left { top: 50%; left: 20px; transform: translateY(-50%); }
        #warn-right { top: 50%; right: 20px; transform: translateY(-50%); }
        #warn-back { bottom: 30px; left: 50%; transform: translateX(-50%); font-size: 3rem; }

        @keyframes pulse {
            from { opacity: 0.3; transform: scale(0.9) translateY(-50%); }
            to { opacity: 1; transform: scale(1.1) translateY(-50%); }
        }
        @keyframes pulse-back {
            from { opacity: 0.3; transform: scale(0.9) translateX(-50%); }
            to { opacity: 1; transform: scale(1.1) translateX(-50%); }
        }
        #warn-back { animation: pulse-back 0.5s infinite alternate; }

        /* Enemy entity */
        #enemy-container {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.1);
            font-size: 10rem;
            display: none;
            filter: drop-shadow(0 0 20px rgba(0,0,0,0.5));
            transition: transform 0.1s linear;
        }

        /* Success text */
        #success-text {
            position: absolute;
            top: 30%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 3rem;
            color: var(--success);
            font-weight: bold;
            text-shadow: 2px 2px 5px #000;
            display: none;
            animation: popUp 0.5s ease-out forwards;
        }

        @keyframes popUp {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        /* Screamer / Game Over Effect */
        .screamer-active {
            animation: shake 0.3s cubic-bezier(.36,.07,.19,.97) both infinite;
            background-color: #ff0000 !important;
        }
        .screamer-active #bg-camera {
            display: none;
        }
        
        #screamer-entity {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(3);
            font-size: 15rem;
            display: none;
            z-index: 20;
        }

        @keyframes shake {
            10%, 90% { transform: translate3d(-5px, 0, 0); }
            20%, 80% { transform: translate3d(5px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-10px, 10px, 0); }
            40%, 60% { transform: translate3d(10px, -10px, 0); }
        }
    </style>
</head>
<body>

    <!-- Camera Background -->
    <video id="bg-camera" autoplay playsinline muted></video>

    <!-- Start Screen -->
    <div id="start-screen" class="overlay">
        <h1>Calle Peligrosa AR 🚦</h1>
        <p>Gira físicamente tu celular para ver a tu alrededor. <br><br>
        Evita que las 🏍️ y 🚶 te atropellen mirándolos de frente antes de que sea tarde.<br><br>
        ¡Haz caso a las flechas rojas!</p>
        <button id="btn-start">Iniciar Juego</button>
    </div>

    <!-- Game HUD (Heads Up Display) -->
    <div id="game-hud" class="hidden">
        <div id="score-display">0</div>
        
        <!-- Directional Warnings -->
        <div id="warn-left" class="warning-indicator">⬅️</div>
        <div id="warn-right" class="warning-indicator">➡️</div>
        <div id="warn-back" class="warning-indicator">⚠️ ATRÁS ⚠️</div>
        
        <!-- The Enemy -->
        <div id="enemy-container">🏍️</div>
        <div id="success-text">¡Esquivado!</div>
    </div>

    <!-- Screamer Entity -->
    <div id="screamer-entity">💥</div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="overlay hidden" style="z-index: 30;">
        <h1 style="color: var(--alert);">¡TE ATROPELLARON!</h1>
        <p>Puntaje Final: <span id="final-score" style="font-weight:bold; font-size: 2rem;">0</span></p>
        <button id="btn-restart">Volver a jugar</button>
    </div>

    <script>
        // DOM Elements
        const startScreen = document.getElementById('start-screen');
        const gameHud = document.getElementById('game-hud');
        const gameOverScreen = document.getElementById('game-over-screen');
        const btnStart = document.getElementById('btn-start');
        const btnRestart = document.getElementById('btn-restart');
        const scoreDisplay = document.getElementById('score-display');
        const finalScore = document.getElementById('final-score');
        const bgCamera = document.getElementById('bg-camera');
        
        const enemyContainer = document.getElementById('enemy-container');
        const warnLeft = document.getElementById('warn-left');
        const warnRight = document.getElementById('warn-right');
        const warnBack = document.getElementById('warn-back');
        const successText = document.getElementById('success-text');
        const screamerEntity = document.getElementById('screamer-entity');

        // Game State
        let isPlaying = false;
        let score = 0;
        let gameLoopId;
        
        // Orientation variables
        let currentAngle = 0;
        let baseAngle = 0;
        
        // Enemy State
        let activeEnemy = false;
        let enemyType = '🏍️';
        let enemyZone = 0; // 0: Frente, 1: Derecha, 2: Atrás, 3: Izquierda
        let enemyStartTime = 0;
        let enemyDuration = 3000; // MS to dodge
        let enemyTypes = ['🏍️', '🚶', '🏎️', '🚴'];

        btnStart.addEventListener('click', initGame);
        btnRestart.addEventListener('click', resetGame);

        async function initGame() {
            // Request Orientation Permission (Crucial for iOS)
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                try {
                    const permission = await DeviceOrientationEvent.requestPermission();
                    if (permission !== 'granted') {
                        alert('Se requieren permisos de giroscopio para jugar.');
                        return;
                    }
                } catch (error) {
                    console.error('Error requesting orientation permission:', error);
                }
            }

            // Start Camera
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                bgCamera.srcObject = stream;
            } catch (err) {
                console.warn('Cámara no disponible, usando fondo negro.', err);
                // Game can still play without camera, relies on gyro
            }

            // Start Sensors
            window.addEventListener('deviceorientation', handleOrientation);

            // Hide UI, Start Game
            startScreen.classList.add('hidden');
            
            // Give 1 second to calibrate 'Frente'
            setTimeout(() => {
                calibrateBaseAngle();
                gameHud.classList.remove('hidden');
                isPlaying = true;
                score = 0;
                updateScore();
                spawnEnemy();
                gameLoopId = requestAnimationFrame(gameLoop);
            }, 1000);
        }

        function handleOrientation(event) {
            // Normalize angle. Prefer webkitCompassHeading (iOS), fallback to alpha (Android)
            if (event.webkitCompassHeading) {
                currentAngle = event.webkitCompassHeading;
            } else if (event.alpha !== null) {
                // Alpha goes counter-clockwise. Subtract from 360 to make it clockwise like compass.
                currentAngle = 360 - event.alpha; 
            }
        }

        function calibrateBaseAngle() {
            baseAngle = currentAngle;
        }

        // Zones: 0 (Front), 1 (Right), 2 (Back), 3 (Left)
        function getFacingZone() {
            // Calculate relative angle (0 to 360) clockwise from calibration point
            let relAngle = (currentAngle - baseAngle + 360) % 360;
            
            if (relAngle > 315 || relAngle <= 45) return 0; // Frente
            if (relAngle > 45 && relAngle <= 135) return 1;  // Derecha
            if (relAngle > 135 && relAngle <= 225) return 2; // Atrás
            if (relAngle > 225 && relAngle <= 315) return 3; // Izquierda
            return 0;
        }

        function spawnEnemy() {
            if (!isPlaying) return;
            activeEnemy = true;
            enemyStartTime = Date.now();
            
            // Speed up game gradually
            enemyDuration = Math.max(1200, 3000 - (score * 150)); 
            
            // Randomize enemy
            enemyType = enemyTypes[Math.floor(Math.random() * enemyTypes.length)];
            enemyContainer.innerText = enemyType;
            screamerEntity.innerText = '💥'; // Crash icon
            
            // Pick random zone (0, 1, 2, or 3)
            enemyZone = Math.floor(Math.random() * 4);
            
            enemyContainer.style.display = 'none';
            hideWarnings();
        }

        function gameLoop() {
            if (!isPlaying) return;

            let facingZone = getFacingZone();

            if (activeEnemy) {
                let elapsed = Date.now() - enemyStartTime;
                let progress = elapsed / enemyDuration;

                if (progress >= 1) {
                    // Time's up! Resolve conflict
                    if (facingZone === enemyZone) {
                        dodgeEnemy();
                    } else {
                        triggerGameOver();
                        return; // Stop loop
                    }
                } else {
                    // Render current state
                    if (facingZone === enemyZone) {
                        // Player is looking at the enemy
                        hideWarnings();
                        enemyContainer.style.display = 'block';
                        // Scale from 0.1 to 3 to simulate approaching
                        let scale = 0.1 + (progress * 3);
                        enemyContainer.style.transform = `translate(-50%, -50%) scale(${scale})`;
                    } else {
                        // Player is NOT looking, show directional warnings
                        enemyContainer.style.display = 'none';
                        showWarnings(facingZone, enemyZone);
                    }
                }
            }

            gameLoopId = requestAnimationFrame(gameLoop);
        }

        function showWarnings(facing, target) {
            hideWarnings();
            // Calculate relative position of target to where we are facing
            let relation = (target - facing + 4) % 4;

            if (relation === 1) {
                warnRight.style.display = 'block';
            } else if (relation === 3) {
                warnLeft.style.display = 'block';
            } else if (relation === 2) {
                warnBack.style.display = 'block';
            }
        }

        function hideWarnings() {
            warnLeft.style.display = 'none';
            warnRight.style.display = 'none';
            warnBack.style.display = 'none';
        }

        function dodgeEnemy() {
            activeEnemy = false;
            score++;
            updateScore();
            enemyContainer.style.display = 'none';
            
            // Show success animation
            successText.style.display = 'block';
            successText.style.animation = 'none';
            successText.offsetHeight; // trigger reflow
            successText.style.animation = 'popUp 0.5s ease-out forwards';

            // Wait a brief moment, then spawn next
            setTimeout(() => {
                successText.style.display = 'none';
                spawnEnemy();
            }, 800);
        }

        function updateScore() {
            scoreDisplay.innerText = score;
        }

        function triggerGameOver() {
            isPlaying = false;
            activeEnemy = false;
            cancelAnimationFrame(gameLoopId);
            
            hideWarnings();
            enemyContainer.style.display = 'none';
            gameHud.classList.add('hidden');

            // Haptic Feedback
            if(navigator.vibrate) navigator.vibrate([200, 100, 300]);

            // Screamer effect
            document.body.classList.add('screamer-active');
            screamerEntity.style.display = 'block';

            setTimeout(() => {
                document.body.classList.remove('screamer-active');
                screamerEntity.style.display = 'none';
                
                finalScore.innerText = score;
                gameOverScreen.classList.remove('hidden');
            }, 1000);
        }

        function resetGame() {
            gameOverScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            
            // Stop camera to re-init properly if needed
            if(bgCamera.srcObject) {
                bgCamera.srcObject.getTracks().forEach(track => track.stop());
            }
            window.removeEventListener('deviceorientation', handleOrientation);
        }

    </script>
</body>
</html>
