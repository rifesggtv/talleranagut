<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  />
  <meta
    name="theme-color"
    content="#efe7d5"
  />
  <meta
    name="description"
    content="Esquivar el R — intervención digital situada sobre movilidad cotidiana en la Entrada Rafael Azula de la UPTC."
  />
  <title>Esquivar el R — versión sketch expandida</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  />
  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  />
  <link
    href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Permanent+Marker&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --ink: #151515;
      --ink-soft: #2d2b28;
      --paper: #efe7d5;
      --paper-2: #e3dbc9;
      --paper-3: #f7f1e5;
      --paper-4: #d8cfbd;
      --yellow: #f7c700;
      --yellow-soft: #ffe16a;
      --blue: #b8c8d6;
      --blue-2: #98aebb;
      --red: #d84232;
      --red-soft: #e4776b;
      --gray: #766f64;
      --gray-2: #a29a8d;
      --green: #6d9c79;
      --green-soft: #a4c7aa;
      --shadow: rgba(0, 0, 0, 0.18);
      --shadow-soft: rgba(0, 0, 0, 0.08);
      --scribble: rgba(21, 21, 21, 0.13);
      --marker: "Permanent Marker", system-ui, sans-serif;
      --hand: "Caveat", "Comic Sans MS", cursive;
      --ui-gap: 10px;
      --safe-bottom: max(18px, env(safe-area-inset-bottom));
      --safe-top: max(10px, env(safe-area-inset-top));
    }

    * {
      box-sizing: border-box;
    }

    html {
      margin: 0;
      min-height: 100%;
      background: #111111;
      color: var(--ink);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100%;
      background: #111111;
      color: var(--ink);
      overflow-x: hidden;
      font-family: var(--hand);
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      -webkit-tap-highlight-color: transparent;
    }

    .hidden {
      display: none !important;
    }

    .screen {
      width: 100%;
      min-height: 100svh;
    }

    .marker {
      font-family: var(--marker);
    }

    .hand {
      font-family: var(--hand);
    }

    .paper-bg {
      background:
        linear-gradient(
          rgba(255, 255, 255, 0.2),
          rgba(255, 255, 255, 0.2)
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0 25px,
          rgba(35, 35, 35, 0.05) 25px 26px
        ),
        repeating-linear-gradient(
          90deg,
          transparent 0 25px,
          rgba(35, 35, 35, 0.035) 25px 26px
        ),
        var(--paper);
    }

    .paper-noise {
      position: fixed;
      inset: 0;
      z-index: 50;
      pointer-events: none;
      opacity: 0.17;
      mix-blend-mode: multiply;
      background-image:
        radial-gradient(
          circle at 10% 20%,
          rgba(0, 0, 0, 0.18) 0 0.6px,
          transparent 0.8px
        ),
        radial-gradient(
          circle at 70% 45%,
          rgba(0, 0, 0, 0.12) 0 0.5px,
          transparent 0.7px
        ),
        radial-gradient(
          circle at 30% 80%,
          rgba(0, 0, 0, 0.1) 0 0.5px,
          transparent 0.7px
        );
      background-size:
        11px 11px,
        17px 17px,
        13px 13px;
    }

    .sketch-box {
      position: relative;
      background: rgba(247, 241, 229, 0.93);
      border: 3px solid var(--ink);
      box-shadow:
        6px 7px 0 rgba(21, 21, 21, 0.16);
    }

    .sketch-box::before {
      content: "";
      position: absolute;
      inset: 4px -5px -4px 5px;
      border: 1px solid rgba(21, 21, 21, 0.42);
      transform: rotate(0.45deg);
      pointer-events: none;
    }

    .sketch-box::after {
      content: "";
      position: absolute;
      inset: -4px 5px 5px -4px;
      border: 1px solid rgba(21, 21, 21, 0.42);
      transform: rotate(-0.35deg);
      pointer-events: none;
    }

    .highlight {
      position: relative;
      z-index: 0;
      display: inline-block;
    }

    .highlight::before {
      content: "";
      position: absolute;
      z-index: -1;
      left: -6px;
      right: -6px;
      bottom: 0.08em;
      height: 0.56em;
      background: var(--yellow);
      transform: rotate(-1.3deg);
      clip-path: polygon(
        0 12%,
        100% 0,
        97% 100%,
        2% 88%
      );
    }

    .tape {
      position: absolute;
      width: 58px;
      height: 17px;
      background: rgba(247, 231, 174, 0.8);
      border: 1px solid rgba(60, 55, 45, 0.18);
      mix-blend-mode: multiply;
      transform: rotate(-8deg);
      pointer-events: none;
    }

    .tape.tl {
      top: -8px;
      left: 18px;
    }

    .tape.tr {
      top: -8px;
      right: 18px;
      transform: rotate(7deg);
    }

    .tape.bl {
      bottom: -8px;
      left: 20px;
      transform: rotate(5deg);
    }

    .tape.br {
      bottom: -8px;
      right: 20px;
      transform: rotate(-6deg);
    }

    .intro-screen {
      position: relative;
      overflow: hidden;
    }

    .intro-wrap {
      position: relative;
      z-index: 2;
      width: min(1160px, calc(100% - 28px));
      margin: 0 auto;
      padding: 32px 0 48px;
    }

    .title-zone {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      align-items: start;
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 6px;
      color: var(--gray);
      font-family: var(--hand);
      font-size: 1.15rem;
      letter-spacing: 0.03em;
      transform: rotate(-1deg);
    }

    .main-title {
      margin: 0;
      font-family: var(--marker);
      font-size: clamp(4.2rem, 11vw, 9rem);
      line-height: 0.82;
      letter-spacing: -0.055em;
      text-transform: uppercase;
      transform: rotate(-1.2deg);
      text-shadow:
        2px 2px 0 rgba(0, 0, 0, 0.08);
    }

    .main-title .r {
      color: var(--yellow);
      -webkit-text-stroke: 2px var(--ink);
      text-shadow:
        4px 5px 0 rgba(0, 0, 0, 0.15);
    }

    .manifesto {
      max-width: 640px;
      margin: 22px 0 0;
      font-family: var(--hand);
      font-size: clamp(1.5rem, 3.1vw, 2.45rem);
      font-weight: 700;
      line-height: 1.02;
      transform: rotate(0.2deg);
    }

    .doodle-card {
      padding: 22px 22px 20px;
      background: #f4eddf;
      transform: rotate(0.8deg);
    }

    .doodle-card h2 {
      margin: 0 0 10px;
      font-family: var(--marker);
      font-size: clamp(1.65rem, 4vw, 3.1rem);
      line-height: 1;
    }

    .doodle-card p {
      margin: 0.65rem 0;
      font-family: var(--hand);
      font-size: 1.25rem;
      line-height: 1.05;
    }

    .critical {
      border-left: 10px solid var(--yellow);
      padding-left: 12px;
    }

    .intro-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 26px;
    }

    .mini-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .mini-step {
      position: relative;
      padding: 14px 12px;
      background: rgba(255, 255, 255, 0.45);
      border: 2px solid var(--ink);
      transform: rotate(var(--rot, 0deg));
    }

    .mini-step strong {
      display: block;
      margin-bottom: 5px;
      font-family: var(--marker);
      font-size: 1.05rem;
    }

    .mini-step span {
      font-family: var(--hand);
      font-size: 1.08rem;
      line-height: 1.05;
    }

    .mini-step::before {
      content: attr(data-n);
      position: absolute;
      top: -12px;
      left: -8px;
      width: 29px;
      height: 29px;
      display: grid;
      place-items: center;
      background: var(--paper-3);
      border: 2px solid var(--ink);
      border-radius: 50%;
      font-family: var(--marker);
      font-size: 0.85rem;
    }

    .info-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 14px;
    }

    .note-card {
      padding: 16px 16px 15px;
      background: rgba(255, 255, 255, 0.38);
      border: 2px solid var(--ink);
      font-family: var(--hand);
      font-size: 1.07rem;
      line-height: 1.08;
      transform: rotate(var(--rot, 0deg));
    }

    .note-card strong {
      display: block;
      margin-bottom: 5px;
      font-family: var(--marker);
      font-size: 1rem;
    }

    .note-card.safety {
      background: rgba(247, 199, 0, 0.24);
    }

    .note-card.privacy {
      background: rgba(184, 200, 214, 0.42);
    }

    .intro-actions {
      display: grid;
      grid-template-columns: 1.35fr 0.85fr;
      gap: 12px;
      margin-top: 20px;
    }

    .btn-sketch {
      position: relative;
      padding: 17px 18px;
      background: var(--paper-3);
      border: 3px solid var(--ink);
      color: var(--ink);
      box-shadow:
        7px 8px 0 rgba(0, 0, 0, 0.18);
      font-family: var(--marker);
      font-size: 1rem;
      text-align: center;
      cursor: pointer;
      transform: rotate(var(--rot, 0deg));
      transition:
        transform 0.12s ease,
        box-shadow 0.12s ease,
        filter 0.12s ease;
    }

    .btn-sketch::before {
      content: "";
      position: absolute;
      inset: 4px -5px -4px 5px;
      border: 1px solid var(--ink);
      transform: rotate(0.8deg);
      pointer-events: none;
    }

    .btn-sketch:hover {
      transform:
        translateY(-2px)
        rotate(var(--rot, 0deg));
      filter: brightness(1.02);
    }

    .btn-sketch:active {
      transform:
        translateY(3px)
        rotate(var(--rot, 0deg));
      box-shadow:
        3px 4px 0 rgba(0, 0, 0, 0.18);
    }

    .btn-primary {
      background: var(--yellow);
    }

    .btn-secondary {
      background: var(--blue);
    }

    .btn-danger {
      background: var(--red-soft);
    }

    .source-note {
      margin-top: 14px;
      color: #5b554c;
      font-family: var(--hand);
      font-size: 0.95rem;
      transform: rotate(-0.25deg);
    }

    .intro-doodle {
      position: absolute;
      pointer-events: none;
      opacity: 0.5;
    }

    .intro-doodle.one {
      top: 2%;
      right: -20px;
      width: 150px;
      height: 150px;
      border: 2px solid var(--ink);
      transform: rotate(12deg);
      border-radius: 46% 54% 50% 50%;
    }

    .intro-doodle.two {
      bottom: 10%;
      left: -40px;
      width: 170px;
      height: 100px;
      border-top: 4px solid var(--ink);
      border-bottom: 2px solid var(--ink);
      transform: rotate(-12deg);
    }

    .game-screen {
      background: #111111;
    }

    .camera-stage {
      position: relative;
      width: 100%;
      height: 100svh;
      overflow: hidden;
      background: #d8d0c2;
      touch-action: none;
    }

    #camera,
    #vision-canvas,
    #game-canvas,
    #fx-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #camera {
      background:
        radial-gradient(
          circle at 50% 42%,
          #504a43,
          #111 74%
        );
      filter:
        grayscale(0.35)
        contrast(1.05)
        sepia(0.12);
    }

    #vision-canvas,
    #game-canvas,
    #fx-canvas {
      pointer-events: none;
    }

    .paper-overlay {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(
          rgba(239, 231, 213, 0.12),
          rgba(239, 231, 213, 0.12)
        ),
        repeating-linear-gradient(
          0deg,
          transparent 0 28px,
          rgba(255, 255, 255, 0.025) 28px 29px
        );
      mix-blend-mode: screen;
    }

    .edge-scribbles {
      position: absolute;
      inset: 8px;
      z-index: 3;
      pointer-events: none;
      border: 3px solid rgba(20, 20, 20, 0.75);
      transform: rotate(0.08deg);
      box-shadow:
        4px 2px 0 rgba(20, 20, 20, 0.15),
        -3px 4px 0 rgba(20, 20, 20, 0.09);
    }

    .hud {
      position: absolute;
      z-index: 6;
    }

    .hud-top {
      top: var(--safe-top);
      left: 10px;
      right: 10px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 9px;
    }

    .hud-panel {
      position: relative;
      padding: 8px 10px;
      background: rgba(247, 241, 229, 0.88);
      border: 2px solid var(--ink);
      color: var(--ink);
      box-shadow:
        4px 5px 0 rgba(0, 0, 0, 0.17);
    }

    .hud-panel::after {
      content: "";
      position: absolute;
      inset: 2px -4px -2px 4px;
      border: 1px solid rgba(20, 20, 20, 0.55);
      transform: rotate(0.35deg);
      pointer-events: none;
    }

    .hud-label {
      font-family: var(--hand);
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-block strong {
      display: block;
      font-family: var(--marker);
      font-size: 1.18rem;
    }

    .risk-block {
      display: grid;
      grid-template-columns: 1fr auto;
      grid-template-areas:
        "label label"
        "track text";
      gap: 5px 10px;
      align-items: center;
    }

    .risk-block .hud-label {
      grid-area: label;
    }

    .risk-track {
      grid-area: track;
      height: 15px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.11);
      border: 2px solid var(--ink);
      transform: skewX(-4deg);
    }

    #risk-bar {
      display: block;
      width: 10%;
      height: 100%;
      background:
        repeating-linear-gradient(
          -45deg,
          rgba(0, 0, 0, 0.18) 0 3px,
          transparent 3px 6px
        ),
        var(--yellow);
      transition:
        width 0.2s ease,
        background 0.2s ease;
    }

    #risk-text {
      grid-area: text;
      font-family: var(--marker);
      font-size: 0.85rem;
    }

    .mini-actions {
      display: flex;
      gap: 6px;
      align-items: stretch;
    }

    .mini-hud-btn {
      min-width: 42px;
      padding: 6px 8px;
      background: var(--paper-3);
      border: 2px solid var(--ink);
      color: var(--ink);
      box-shadow:
        3px 4px 0 rgba(0, 0, 0, 0.13);
      font-family: var(--marker);
      cursor: pointer;
      transform: rotate(var(--rot, 0deg));
    }

    .sensor-panel {
      top: 88px;
      left: 10px;
      right: 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }

    .sensor {
      min-width: 0;
      padding: 7px 8px;
      background: rgba(247, 241, 229, 0.86);
      border: 2px solid var(--ink);
      color: var(--ink);
      box-shadow:
        3px 4px 0 rgba(0, 0, 0, 0.14);
      transform: rotate(var(--rot, 0deg));
    }

    .sensor span {
      display: block;
      overflow: hidden;
      font-family: var(--hand);
      font-size: 0.72rem;
      font-weight: 700;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .sensor strong {
      display: block;
      margin-top: 1px;
      font-family: var(--marker);
      font-size: 1.05rem;
    }

    .status-strip {
      position: absolute;
      z-index: 7;
      top: 150px;
      left: 50%;
      max-width: calc(100% - 28px);
      padding: 6px 10px;
      background: var(--yellow);
      border: 2px solid var(--ink);
      color: var(--ink);
      box-shadow:
        4px 5px 0 rgba(0, 0, 0, 0.15);
      font-family: var(--marker);
      font-size: 0.72rem;
      text-align: center;
      transform:
        translateX(-50%)
        rotate(-0.6deg);
    }

    .route-ui {
      position: absolute;
      z-index: 6;
      top: 200px;
      right: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      padding: 8px 6px;
      background: rgba(247, 241, 229, 0.8);
      border: 2px solid var(--ink);
      color: var(--ink);
      box-shadow:
        3px 4px 0 rgba(0, 0, 0, 0.14);
      font-family: var(--marker);
      font-size: 0.65rem;
      transform: rotate(0.7deg);
    }

    .route-line {
      position: relative;
      width: 13px;
      height: 125px;
      overflow: hidden;
      background: rgba(0, 0, 0, 0.08);
      border: 2px solid var(--ink);
    }

    .route-line i {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 100%;
      height: 0%;
      background: var(--yellow);
      transition: height 0.15s linear;
    }

    .instruction {
      position: absolute;
      z-index: 7;
      left: 50%;
      bottom: 104px;
      padding: 5px 9px;
      background: rgba(247, 241, 229, 0.88);
      border: 2px solid var(--ink);
      color: var(--ink);
      box-shadow:
        3px 4px 0 rgba(0, 0, 0, 0.16);
      font-family: var(--hand);
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      transform:
        translateX(-50%)
        rotate(-0.5deg);
    }

    .controls {
      position: absolute;
      z-index: 8;
      left: 50%;
      bottom: var(--safe-bottom);
      display: flex;
      gap: 10px;
      transform: translateX(-50%);
    }

    .controls button,
    .exit-btn {
      background: rgba(247, 241, 229, 0.92);
      border: 3px solid var(--ink);
      color: var(--ink);
      box-shadow:
        4px 5px 0 rgba(0, 0, 0, 0.2);
      font-family: var(--marker);
      cursor: pointer;
    }

    .controls button {
      width: 64px;
      height: 58px;
      font-size: 1.4rem;
      clip-path: polygon(
        5% 8%,
        92% 0,
        100% 88%,
        9% 100%,
        0 45%
      );
    }

    .controls #center-btn {
      width: 56px;
      background: var(--yellow);
    }

    .exit-btn {
      position: absolute;
      z-index: 9;
      right: 12px;
      bottom: var(--safe-bottom);
      width: 43px;
      height: 43px;
      font-size: 1.25rem;
      transform: rotate(4deg);
    }

    .collision-flash {
      position: absolute;
      inset: 0;
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      background:
        radial-gradient(
          circle at center,
          rgba(216, 66, 50, 0) 0 45%,
          rgba(216, 66, 50, 0.52) 100%
        );
      transition: opacity 0.12s ease;
    }

    .collision-flash.active {
      opacity: 1;
    }

    .pause-card {
      position: absolute;
      z-index: 20;
      inset: 50% auto auto 50%;
      width: min(420px, calc(100% - 34px));
      padding: 24px;
      background: var(--paper-3);
      border: 3px solid var(--ink);
      box-shadow:
        8px 9px 0 rgba(0, 0, 0, 0.25);
      transform:
        translate(-50%, -50%)
        rotate(-0.6deg);
    }

    .pause-card h3 {
      margin: 0 0 10px;
      font-family: var(--marker);
      font-size: 2rem;
    }

    .pause-card p {
      margin: 0 0 16px;
      font-family: var(--hand);
      font-size: 1.15rem;
      line-height: 1.05;
    }

    .tutorial-overlay {
      position: absolute;
      inset: 0;
      z-index: 19;
      display: grid;
      place-items: center;
      background: rgba(0, 0, 0, 0.58);
      backdrop-filter: blur(2px);
    }

    .tutorial-card {
      width: min(520px, calc(100% - 28px));
      padding: 22px;
      background: var(--paper-3);
      border: 3px solid var(--ink);
      box-shadow:
        7px 8px 0 rgba(0, 0, 0, 0.24);
      transform: rotate(0.5deg);
    }

    .tutorial-card h3 {
      margin: 0 0 12px;
      font-family: var(--marker);
      font-size: 1.8rem;
    }

    .tutorial-card ol {
      margin: 0 0 18px;
      padding-left: 22px;
      font-family: var(--hand);
      font-size: 1.1rem;
      line-height: 1.1;
    }

    .result-screen {
      min-height: 100svh;
    }

    .result-wrap {
      width: min(900px, calc(100% - 28px));
      margin: 0 auto;
      padding: 36px 0 50px;
    }

    .result-title {
      margin: 0 0 14px;
      font-family: var(--marker);
      font-size: clamp(2.6rem, 8vw, 6rem);
      line-height: 0.9;
      text-transform: uppercase;
      transform: rotate(-0.7deg);
    }

    .result-title span {
      color: var(--yellow);
      -webkit-
